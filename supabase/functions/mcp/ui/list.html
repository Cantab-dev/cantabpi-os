<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Cantab OS list view (MCP Apps). Source of truth; scripts/build-ui.mjs turns it into ../ui_html.ts.
     Built from the memo templates (docs/chat-ux-status.md §3.3). Emoji icons only; no external fetch. -->
<style>
:root{--red:#A32D2D;--t1:var(--color-text-primary,#1f1f1f);--t2:var(--color-text-secondary,#5c5c5c);--t3:var(--color-text-tertiary,#8c8c8c);--b1:var(--color-border-tertiary,rgba(0,0,0,.08));--b2:var(--color-border-secondary,rgba(0,0,0,.16));--b3:var(--color-border-primary,rgba(0,0,0,.32))}
:root[data-theme=dark]{--t1:var(--color-text-primary,#ececec);--t2:var(--color-text-secondary,#b4b4b4);--t3:var(--color-text-tertiary,#8a8a8a);--b1:var(--color-border-tertiary,rgba(255,255,255,.08));--b2:var(--color-border-secondary,rgba(255,255,255,.16));--b3:var(--color-border-primary,rgba(255,255,255,.32))}
*{box-sizing:border-box}
body{margin:0;padding:4px 2px 8px;font:14px/1.45 var(--font-sans,system-ui,-apple-system,"Segoe UI",sans-serif);color:var(--t1);background:transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.h{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:2px solid var(--red)}
.l{width:28px;height:28px;border-radius:6px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500;flex:none}
.ht{flex:1;min-width:0}.hn{font-weight:500}.hs{font-size:12px;color:var(--t2)}.hr{font-size:12px;color:var(--t3);text-align:right}
.g{display:grid;grid-template-columns:96px minmax(0,1fr);border-bottom:.5px solid var(--b2)}
.g.c{grid-template-columns:44px minmax(0,1fr)}
.gl{font-size:12px;font-weight:500;color:var(--t2);height:44px;display:flex;align-items:center}
.gl.od{color:var(--red)}
.gi{height:44px;display:flex;align-items:center;font-size:20px}
.rw{border-bottom:.5px solid var(--b1)}.rw:last-child{border-bottom:none}
.r{display:flex;align-items:center;gap:14px;height:44px;cursor:pointer;user-select:none}
.cb{width:18px;height:18px;flex:none;padding:0;border:1.5px solid var(--b3);border-radius:3px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:12px;line-height:1}
.cb.on{background:var(--red);border-color:var(--red)}
.n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dn .n{text-decoration:line-through;color:var(--t3)}
.ch .n::after{content:" •";color:var(--red)}
.ic{font-size:17px;width:22px;text-align:center;flex:none}
.gi .ic{font-size:20px;width:auto}
.d{width:12px;height:12px;border-radius:50%;flex:none;margin-right:4px}
.d0{border:1.5px solid var(--b3)}
.nm{width:240px;flex:none;display:flex;gap:8px;align-items:center;overflow:hidden}
.nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt{flex:1;min-width:0;display:flex;gap:6px;align-items:center;color:var(--t2);font-size:13px}
.nt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv{color:var(--t3);flex:none;transition:transform .15s;font-size:16px;width:10px}
.rw.o .cv{transform:rotate(90deg)}
.p{display:none;padding:0 0 12px;font-size:13px}.rw.o .p{display:block}
.pa{line-height:1.5;margin-bottom:6px}
.hi{font-size:12px;color:var(--t3);line-height:1.6;margin-bottom:6px}
.pm{color:var(--t2);margin-bottom:6px;word-break:break-all}
.u{display:none;gap:8px;align-items:center}.u.s{display:flex}
.u input{flex:1;min-width:0;font:inherit;font-size:12px;padding:3px 6px;border:.5px solid var(--b2);border-radius:4px;background:transparent;color:var(--t1)}
button.b{font:inherit;font-size:13px;padding:4px 12px;border:.5px solid var(--b3);border-radius:6px;background:transparent;color:var(--t1);cursor:pointer}
button.b:disabled{opacity:.5;cursor:default}
.kh{display:flex;align-items:center;gap:8px;margin-top:16px;padding-bottom:6px;font-size:12px;font-weight:500;color:var(--t2);border-bottom:.5px solid var(--b2)}
.f{display:flex;align-items:center;gap:12px;justify-content:flex-end;padding-top:12px;font-size:13px;color:var(--t2)}
.e{padding:16px 0;color:var(--t2)}
@media (max-width:480px){.g{grid-template-columns:72px minmax(0,1fr)}.nm{width:140px}.hr{display:none}}
</style></head><body>
<div id="app"><div class="e">Loading…</div></div>
<script>
const A=document.getElementById('app');
const IM={3:['#E24B4A','High'],2:['#EF9F27','Medium'],1:['#639922','Low']};
const KM={docs:['Docs','📄'],sheets:['Sheets','📊'],slides:['Slides','🖥️']};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dot=i=>IM[i]?`<span class="d" style="background:${IM[i][0]}" title="${IM[i][1]} importance"></span>`:'<span class="d d0" title="No importance"></span>';
const cat=c=>`<span class="ic" title="${esc(c?c.name:'No category')}" aria-label="${esc(c?c.name:'No category')}">${c?esc(c.icon):'<span style="color:var(--t3)">–</span>'}</span>`;
const hist=s=>String(s||'').split('\n').filter(Boolean).reverse().map(x=>{const m=x.match(/^(\d{4}-\d{2}-\d{2}): (.*)$/);return m?m[1]+': '+esc(m[2]):esc(x)}).join('<br>');
const head=(t,sub,right)=>`<h2 class="sr">Cantab OS ${esc(t)}</h2><div class="h"><div class="l">π</div><div class="ht"><div class="hn">Cantab OS · ${esc(t)}</div><div class="hs">${esc(sub)}</div></div>${right?`<div class="hr">${esc(right)}</div>`:''}</div>`;
const more=d=>d&&d.truncated&&d.next?`<div class="f">${esc(d.next)}</div>`:'';
const panel=(o,extra)=>`<div class="p"><div class="pa">${o.action?esc(o.action):'<span class="hi">No action yet</span>'}</div>${o.context?`<div class="hi">${hist(o.context)}</div>`:''}${extra||''}</div>`;
// Groups rows by category (no category last), then importance high first, then name.
const byCat=rows=>{const m=new Map();for(const o of rows){const k=o.category?o.category.name:'~';if(!m.has(k))m.set(k,[]);m.get(k).push(o)}
  return [...m.keys()].sort().map(k=>m.get(k).sort((a,b)=>(b.importance||0)-(a.importance||0)||String(a.name).localeCompare(String(b.name))))};

// MCP Apps bridge over postMessage (method names and initialize params as in ext-apps 2.0.3).
let n=0;const pend={};
const send=m=>parent.postMessage(Object.assign({jsonrpc:'2.0'},m),'*');
const req=(method,params)=>new Promise((res,rej)=>{const id=++n;pend[id]={res,rej};send({id,method,params})});
const callTool=(name,args)=>req('tools/call',{name,arguments:args});
// The host says at initialize whether it takes context updates; the footer reports what happened.
let caps={};
const tellModel=text=>!caps.updateModelContext?Promise.resolve('not supported by this host'):req('ui/update-model-context',{content:[{type:'text',text}]}).then(()=>'told',e=>'error: '+((e&&e.message)||'unknown'));
function applyContext(c){if(!c)return;if(c.theme)document.documentElement.dataset.theme=c.theme;
  const v=c.styles&&c.styles.variables;if(v)for(const k in v)if(v[k])document.documentElement.style.setProperty(k,v[k])}
addEventListener('message',e=>{
  if(e.source!==parent)return;const m=e.data;if(!m||m.jsonrpc!=='2.0')return;
  if(m.id!=null&&!m.method){const p=pend[m.id];if(p){delete pend[m.id];m.error?p.rej(m.error):p.res(m.result)}return}
  if(m.id!=null){send({id:m.id,result:{}});return}
  if(m.method==='ui/notifications/tool-result')render(m.params);
  else if(m.method==='ui/notifications/host-context-changed')applyContext(m.params);
});

function render(r){
  const sc=r&&r.structuredContent;
  if(!sc||r.isError){A.innerHTML=`<div class="e">${esc((r&&r.content&&r.content[0]&&r.content[0].text)||'No data.')}</div>`;return}
  if(sc.parts)files(sc.parts);
  else if(sc.entity==='todos')todos(sc);
  else if(sc.entity==='leads')leads(sc);
  else if(KM[sc.entity])files([sc]);
  else plain(sc);
  wire();
}

// Click a row to expand it; double-click shows the LinkedIn field; Open buttons go through the host.
function wire(){
  A.querySelectorAll('.rw').forEach(el=>{const r=el.querySelector('.r');
    r.onclick=e=>{if(e.target.closest('.cb'))return;el.classList.toggle('o');if(!el.classList.contains('o')){const u=el.querySelector('.u');if(u)u.classList.remove('s')}};
    r.ondblclick=e=>{if(e.target.closest('.cb'))return;const u=el.querySelector('.u');if(!u)return;el.classList.add('o');u.classList.add('s');const i=u.querySelector('input');if(i){i.focus();i.select()}}});
  A.querySelectorAll('button[data-u]').forEach(b=>b.onclick=()=>req('ui/open-link',{url:b.dataset.u}).catch(()=>{}));
}

function todos(sc){
  const t0=new Date();t0.setHours(0,0,0,0);const eow=6-(t0.getDay()+6)%7;
  const grp=due=>{if(!due)return 4;const d=Math.round((new Date(due+'T00:00:00')-t0)/864e5);return d<0?0:d==0?1:d==1?2:d<=eow?3:4};
  const G=['Overdue','Today','Tomorrow','This week','Later'];
  const rows=sc.rows.map(o=>({...o,s:o.status?1:0,v:o.status?1:0,g:grp(o.due)})).filter(o=>!(o.s&&o.g==0))
    .sort((a,b)=>a.g-b.g||(a.due||'9').localeCompare(b.due||'9')||(b.importance||0)-(a.importance||0));
  const by={};rows.forEach(o=>by[o.label]=o);
  const sub=()=>{const op=rows.filter(o=>!o.s).length,od=rows.filter(o=>!o.s&&o.g==0).length;return op+' open'+(od?' · '+od+' overdue':'')};
  let h=head('todos',sub(),t0.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}));
  if(!rows.length)h+=`<div class="e">${esc(sc.next||'No todos.')}</div>`;
  G.forEach((gn,gi)=>{const rs=rows.filter(o=>o.g==gi);if(!rs.length)return;
    h+=`<div class="g"><div class="gl${gi==0?' od':''}">${gn}</div><div>`+rs.map(o=>`<div class="rw" data-l="${esc(o.label)}"><div class="r"><button class="cb" aria-label="Toggle done"></button><span class="n">${esc(o.name)}${o.action?' <span title="'+esc(o.action)+'">📝</span>':''}</span>${cat(o.category)}${dot(o.importance)}</div>${panel(o,o.due?`<div class="pm">Due ${esc(o.due)}</div>`:'')}</div>`).join('')+'</div></div>'});
  h+=more(sc)+(rows.length?'<div class="f"><span id="m">No changes</span><button class="b" id="sv">Save</button></div>':'');
  A.innerHTML=h;if(!rows.length)return;
  const M=document.getElementById('m'),SV=document.getElementById('sv'),HS=A.querySelector('.hs');
  const draw=el=>{const o=by[el.dataset.l];el.classList.toggle('dn',!!o.v);el.classList.toggle('ch',o.v!=o.s);const c=el.querySelector('.cb');c.classList.toggle('on',!!o.v);c.textContent=o.v?'✓':''};
  const changed=()=>rows.filter(o=>o.v!=o.s);
  const upd=()=>{const d=changed().length;M.textContent=d?d+(d>1?' changes':' change'):'No changes'};
  A.querySelectorAll('.rw').forEach(el=>{draw(el);el.querySelector('.cb').onclick=()=>{const o=by[el.dataset.l];o.v=o.v?0:1;draw(el);upd()}});
  // Save: one edit per changed row, in order, straight to Cantab OS through the host; then tell the model.
  SV.onclick=async()=>{const d=changed();if(!d.length){M.textContent='Nothing to save';return}
    SV.disabled=true;M.textContent='Saving…';const ok=[],bad=[];
    for(const o of d){try{const r=await callTool('edit',{label:o.label,status:!!o.v});if(r&&!r.isError){o.s=o.v;ok.push(o)}else bad.push(o.name)}catch(e){bad.push(o.name)}}
    A.querySelectorAll('.rw').forEach(draw);HS.textContent=sub();SV.disabled=false;
    M.textContent=bad.length?'Not saved: '+bad.join(', '):'Saved';
    if(ok.length){const t=await tellModel('In the Cantab OS todo view the user saved: '+ok.map(o=>o.label+' ('+o.name+') is now '+(o.v?'done':'open')).join('; ')+'.');
      M.textContent+=' · Claude '+(t==='told'?'told':'not told ('+t+')')}
  };
}

function leads(sc){
  let h=head('leads',sc.total+(sc.total==1?' lead':' leads'),'Click for details · double-click for LinkedIn');
  if(!sc.rows.length)h+=`<div class="e">${esc(sc.next||'No leads.')}</div>`;
  for(const rs of byCat(sc.rows)){
    h+=`<div class="g c"><div class="gi">${cat(rs[0].category)}</div><div>`+rs.map(o=>`<div class="rw"><div class="r"><span class="nm"><span>${esc(o.full_name||o.name)}</span></span><span class="nt">✨<span>${esc(o.action||'No action yet')}</span></span><span class="cv">›</span>${dot(o.importance)}</div>${panel(o,
      `<div class="pm">✉️ ${o.email?esc(o.email):'No email on file'}</div><div class="u">${o.url_linkedin?`<input readonly value="${esc(o.url_linkedin)}"><button class="b" data-u="${esc(o.url_linkedin)}">Open ↗</button>`:'<span class="hi">No LinkedIn on file</span>'}</div>`)}</div>`).join('')+'</div></div>'}
  A.innerHTML=h+more(sc);
}

function files(parts){
  const tot=parts.reduce((s,p)=>s+(p.total||0),0);
  let h=head('files',tot+(tot==1?' file':' files'),'Click a row for details');
  for(const p of parts){const [kn,ki]=KM[p.entity]||[p.entity,'📄'];
    h+=`<div class="kh">${ki} ${esc(kn)} <span>${p.total||0}</span></div>`;
    if(!p.rows.length)h+=`<div class="e">${esc(p.next||'None yet.')}</div>`;
    for(const rs of byCat(p.rows)){
      h+=`<div class="g c"><div class="gi">${cat(rs[0].category)}</div><div>`+rs.map(o=>`<div class="rw"><div class="r"><span class="nm">${ki}<span>${esc(o.name)}</span></span><span class="nt">📝<span>${esc(o.action||'No action yet')}</span></span><span class="cv">›</span>${dot(o.importance)}</div>${panel(o,o.url?`<div class="pm">${esc(o.url)}</div>`:'')}</div>`).join('')+'</div></div>'}
    h+=more(p)}
  A.innerHTML=h;
}

function plain(sc){
  const rows=sc.rows||[];
  let h=head(sc.entity,rows.length+(sc.total&&sc.total!=rows.length?' of '+sc.total:'')+' shown');
  h+=rows.map(o=>`<div class="r" style="cursor:default;border-bottom:.5px solid var(--b1)">${o.icon?`<span class="ic">${esc(o.icon)}</span>`:''}<span class="n">${esc(o.name||o.description||o.label)}</span><span class="hi" style="margin:0">${esc(o.label)}</span></div>`).join('')||`<div class="e">${esc(sc.next||'Nothing here yet.')}</div>`;
  A.innerHTML=h+more(sc);
}

new ResizeObserver(()=>send({method:'ui/notifications/size-changed',params:{width:document.documentElement.scrollWidth,height:document.documentElement.scrollHeight}})).observe(document.body);
req('ui/initialize',{appCapabilities:{availableDisplayModes:['inline']},appInfo:{name:'cantab-os-list',version:'0.5.1'},protocolVersion:'2026-01-26'})
  .then(r=>{caps=(r&&r.hostCapabilities)||{};applyContext(r&&r.hostContext);send({method:'ui/notifications/initialized'})})
  .catch(()=>{A.innerHTML='<div class="e">This view could not connect to the chat host.</div>'});
</script></body></html>
