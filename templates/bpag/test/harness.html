<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Template harness</title>
<style>
  html, body { margin: 0; height: 100%; }
  iframe { display: block; width: 100%; height: 100vh; border: 0; }
</style>
</head>
<body>
<!-- Stands in for the Lovable page (§8.5): sets window.CP_HOST, then shows a built page through iframe srcdoc.
     ?view=<key>&project=<id>. The backend is faked by check.mjs, which serves this page. -->
<iframe id="frame" title="View"></iframe>
<script>
  var q = new URLSearchParams(location.search);
  window.openViewCalls = [];
  window.CP_HOST = {
    supabaseUrl: location.origin,
    publishableKey: 'pk_test',
    projectId: q.get('project') || 'p-demo',
    getToken: async function () { return 'tok_test'; },
    openView: function (key) { window.openViewCalls.push(key); }
  };
  fetch('dist/' + q.get('view') + '.html', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('no page ' + q.get('view')); return r.text(); })
    .then(function (html) { document.getElementById('frame').srcdoc = html; });
</script>
</body>
</html>
